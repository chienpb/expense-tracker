<?xml version="1.0" encoding="UTF-8"?>
<!--
  Paper Ledger glyph sprite (Asset A8 — hand-drawn).

  Each <symbol> is addressable by id. Consume via:
    <svg width="16" height="16"><use href="/glyphs.svg#glyph-leaf" /></svg>

  All artwork is drawn as pen strokes: stroke="currentColor", fill="none"
  (the star is the one solid shape, filled with currentColor). Paths are
  deliberately a touch irregular — a 1960s clerk's fountain pen, drawn in
  one or two confident strokes. Wobble filters are applied by consumers,
  never inside this sprite.

  All symbols use viewBox="0 0 24 24" and currentColor so consumers control size and color.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" aria-hidden="true">

  <!-- ❧ section opener / decorative bullet — curled vine with one leaf -->
  <symbol id="glyph-leaf" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <!-- main stem, sweeping up from bottom-left and tightening into a curl -->
      <path d="M4.6 19.6 C8.3 18.8 11.6 15.4 13.4 11.2 C14.3 9.1 14.7 6.7 14.1 4.9" />
      <!-- the curl at the tip -->
      <path d="M14.1 4.9 C13.2 3.6 11.3 3.8 10.8 5.3 C10.4 6.7 11.5 7.9 13 7.5" />
      <!-- leaf riding the stem -->
      <path d="M7.8 16.6 C6.3 14.1 7 11.3 9.7 10.1 C10.3 12.9 9.6 15.3 7.8 16.6 Z" />
      <!-- small companion tendril below -->
      <path d="M7.1 19.2 C9.3 19.6 11.8 19.4 13.9 18.4" />
    </g>
  </symbol>

  <!-- ✦ important / starred — four-point star, solid ink -->
  <symbol id="glyph-star" viewBox="0 0 24 24">
    <path fill="currentColor" stroke="currentColor" stroke-width="1" stroke-linejoin="round"
      d="M12.1 3.1 C12.6 6.9 13.7 10.3 20.7 11.9 C13.8 13.6 12.5 16.9 12 20.9 C11.4 17 10.2 13.6 3.3 12.1 C10.2 10.4 11.5 7 12.1 3.1 Z" />
  </symbol>

  <!-- ☞ see also / link out — side-view manicule with cuff -->
  <symbol id="glyph-hand-pointing" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <!-- shirt cuff -->
      <path d="M3.3 8.7 L6.4 8.5 C6.6 11.4 6.6 14.3 6.5 17.2 L3.4 17.4 C3.2 14.5 3.2 11.6 3.3 8.7 Z" />
      <!-- hand: back of hand, index finger out to the right, three curled fingers -->
      <path d="M6.4 9.4 C8.1 8.8 9.9 8.6 11.7 8.8 L19.8 8.9 C21 9 21.1 10.5 19.9 10.7 L13.4 11 C14.7 11.5 14.7 13.1 13.3 13.4 C14.4 14 14.3 15.5 12.9 15.8 C13.8 16.4 13.6 17.7 12.2 17.9 C10.3 18.2 8.1 17.9 6.5 17" />
      <!-- thumb resting along the top -->
      <path d="M8.3 8.9 C9 7.6 10.4 7.1 11.7 7.7" />
    </g>
  </symbol>

  <!-- ✎ edit / write — nib pen at the classic diagonal -->
  <symbol id="glyph-pen" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <!-- barrel: tip lower-left, capped end upper-right -->
      <path d="M4.6 19.5 C5.6 19.1 6.6 18.8 7.6 18.6 C11.4 14.9 15 11.2 18.6 7.4 C19.5 6.5 19.4 5.3 18.5 4.5 C17.6 3.7 16.5 3.7 15.6 4.6 C12 8.3 8.5 12 5.1 15.8 C4.8 17 4.7 18.2 4.6 19.5 Z" />
      <!-- nib slit -->
      <path d="M4.7 19.4 C5.4 18.6 6 17.8 6.6 16.9" />
      <!-- ferrule line across the barrel -->
      <path d="M14.1 6.2 C15.3 7.2 16.4 8.3 17.4 9.4" />
    </g>
  </symbol>

  <!-- ✓ checkmark — one quick pen-stroke -->
  <symbol id="glyph-check" viewBox="0 0 24 24">
    <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
      d="M4.6 13.1 C6.5 14.6 8 16.5 9.1 18.6 C11.4 13.2 14.7 8.5 19.5 5.1" />
  </symbol>

  <!-- × cross out / delete — two strokes, second slightly hastier -->
  <symbol id="glyph-cross" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <path d="M6.1 6.3 C9.9 10 13.8 13.9 17.7 18" />
      <path d="M17.9 6.2 C13.9 9.9 10 13.9 6.3 17.8" />
    </g>
  </symbol>

  <!-- → arrow — shaft drawn with a slight sag, open arrowhead -->
  <symbol id="glyph-arrow-right" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3.6 12.4 C8.6 11.7 13.7 11.7 19.8 12.1" />
      <path d="M15.2 7.5 C16.6 9.4 18.2 10.9 20.3 12.1 C18.2 13.1 16.4 14.6 15 16.6" />
    </g>
  </symbol>

  <!-- ↗ arrow up-right -->
  <symbol id="glyph-arrow-up-right" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M5.3 18.8 C9.4 15 13.4 10.9 17.4 6.7" />
      <path d="M11.4 5.7 C13.6 5.8 15.7 5.7 17.9 5.5 C17.6 7.7 17.6 9.8 17.8 12" />
    </g>
  </symbol>

  <!-- † dagger (footnote) -->
  <symbol id="glyph-dagger" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
      <path d="M12 3.9 C11.8 9.3 11.9 14.7 12.1 20.1" />
      <path d="M7.3 8.2 C10.5 7.7 13.6 7.7 16.7 8.1" />
    </g>
  </symbol>

  <!-- ‡ double dagger -->
  <symbol id="glyph-double-dagger" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
      <path d="M12 3.9 C11.8 9.3 11.9 14.7 12.1 20.1" />
      <path d="M7.3 7.7 C10.5 7.2 13.6 7.2 16.7 7.6" />
      <path d="M7.4 16.4 C10.5 16 13.6 16 16.6 16.3" />
    </g>
  </symbol>

  <!-- ¶ pilcrow -->
  <symbol id="glyph-pilcrow" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <!-- top bar + bowl, drawn as one stroke -->
      <path d="M18.4 4.4 L11.5 4.5 C8.8 4.6 7 6.1 7 8.1 C7 10.1 8.9 11.6 11.6 11.6" />
      <!-- left stem (drops from the bowl) -->
      <path d="M11.6 11.6 C11.5 14.3 11.5 17 11.6 19.6" />
      <!-- right stem (drops from the bar) -->
      <path d="M15.8 4.5 C15.7 9.5 15.7 14.6 15.9 19.6" />
    </g>
  </symbol>

  <!-- § section — two interlocked S-hooks -->
  <symbol id="glyph-section" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M15.7 5.5 C14.9 4.1 12.8 3.6 11.2 4.4 C9.7 5.2 9.4 7.1 10.7 8.2 C12.3 9.5 15.2 9.7 16.2 11.4 C17.1 13 16.2 14.7 14.4 15.1" />
      <path d="M8.3 18.5 C9.1 19.9 11.2 20.4 12.8 19.6 C14.3 18.8 14.6 16.9 13.3 15.8 C11.7 14.5 8.8 14.3 7.8 12.6 C6.9 11 7.8 9.3 9.6 8.9" />
    </g>
  </symbol>

</svg>
